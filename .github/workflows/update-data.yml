name: Update data

# Weekly: AZhK publishes the Mon–Fri schedule once a week, on Monday morning.
# Fetch it, geocode new places, and commit data/ if anything changed. The push
# triggers a Cloudflare Pages redeploy.
#
# Scheduled runs can start late when GitHub is busy (worst at the top of the
# hour), hence odd minutes and a second attempt. If the schedule is already in
# place the second run commits nothing. Run it by hand for a late schedule.
on:
  schedule:
    - cron: "7 4 * * 1" # Monday 09:07 in Almaty (UTC+5)
    - cron: "47 4 * * 1" # Monday 09:47, in case AZhK published late
    - cron: "1 6 * * 1" # TEMP: Monday 11:01, one-off check that scheduled runs work — remove after
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download the schedule page even if cached"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs race to push.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Redacted copies of schedule pages aren't committed; keep them between runs
      # so each week's page is downloaded only once.
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: azhk-raw-${{ github.run_id }}
          restore-keys: azhk-raw-

      - name: Fetch the latest AZhK schedule
        run: pnpm data:fetch ${{ inputs.force && '--force' || '' }}
        env:
          AZHK_CONTACT: ${{ secrets.AZHK_CONTACT }}

      - name: Geocode new places (Nominatim, 1 req/s, cached)
        run: pnpm data:geocode
        env:
          GEOCODER_CONTACT: ${{ secrets.GEOCODER_CONTACT }}

      # Gatekeepers: nothing is committed unless all of these pass.
      - name: Check for personal data
        run: pnpm data:audit
      - run: pnpm data:validate
      - run: pnpm test
      - run: pnpm build:static # what Cloudflare deploys

      - name: Commit changes
        run: |
          git add data/outages.json data/geocache.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          title=$(node -p 'require("./data/outages.json").title')
          git commit -m "chore(data): update AZhK schedule — ${title}"
          git push
